name: macOS iOS Simulator

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mac_ios.yml'

jobs:
  run-mac:
    runs-on: macos-latest
    steps:
      - name: Khởi động iOS Simulator
        run: |
          DEVICE_UDID="98A0BFA3-CEC3-4FD6-9916-5A2149774DBF"
          echo "Booting device: $DEVICE_UDID"
          xcrun simctl boot "$DEVICE_UDID" || true

      - name: Cài đặt và kích hoạt tmate
        run: |
          # Dùng curl tải tmate binary trực tiếp không qua Homebrew để chạy ngay lập tức
          curl -fsSL https://github.com/tmate-io/tmate/releases/download/2.4.0/tmate-2.4.0-macos-arm64.tar.gz -o /tmp/tmate.tar.gz 2>/dev/null || curl -fsSL https://github.com/tmate-io/tmate/releases/download/2.4.0/tmate-2.4.0-macos-amd64.tar.gz -o /tmp/tmate.tar.gz
          tar -xzf /tmp/tmate.tar.gz -C /tmp/ || true
          
          if [ -f /tmp/tmate-2.4.0-macos-arm64/tmate ]; then
            sudo cp /tmp/tmate-2.4.0-macos-arm64/tmate /usr/local/bin/tmate
          elif [ -f /tmp/tmate-2.4.0-macos-amd64/tmate ]; then
            sudo cp /tmp/tmate-2.4.0-macos-amd64/tmate /usr/local/bin/tmate
          else
            brew install tmate
          fi
          
          tmate -S /tmp/tmate.sock new-session -d
          tmate -S /tmp/tmate.sock wait tmate-ready
          
          WEB_URL=$(tmate -S /tmp/tmate.sock display -p '#{tmate_web}')
          SSH_CMD=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}')
          
          git config user.name "hoang-999"
          git config user.email "hoang@example.com"
          git checkout -B tmate-live
          echo "$WEB_URL" > link.txt
          echo "$SSH_CMD" >> link.txt
          git add link.txt
          git commit -m "Live link: $WEB_URL"
          git push -f origin tmate-live
          
          while [ -S /tmp/tmate.sock ]; do
            sleep 10
          done
