name: macOS iOS Simulator

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mac_ios.yml'

jobs:
  run-mac:
    runs-on: macos-latest
    steps:
      - name: Khởi động iOS Simulator
        run: |
          DEVICE_UDID="98A0BFA3-CEC3-4FD6-9916-5A2149774DBF"
          echo "Booting device: $DEVICE_UDID"
          xcrun simctl boot "$DEVICE_UDID" || true

      - name: Kích hoạt tmate và tải file link lên Artifact
        run: |
          brew install tmate
          tmate -S /tmp/tmate.sock new-session -d
          tmate -S /tmp/tmate.sock wait tmate-ready
          
          WEB_URL=$(tmate -S /tmp/tmate.sock display -p '#{tmate_web}')
          SSH_CMD=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}')
          
          mkdir -p link_artifact
          echo "$WEB_URL" > link_artifact/tmate_web.txt
          echo "$SSH_CMD" > link_artifact/tmate_ssh.txt
          
          # Đổi tên commit message của run hoặc in ra console
          echo "::notice title=TMATE_WEB_LINK::$WEB_URL"
          echo "::notice title=TMATE_SSH_CMD::$SSH_CMD"

      - name: Upload Link Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tmate-link
          path: link_artifact/

      - name: Giữ kết nối mở
        run: |
          while [ -S /tmp/tmate.sock ]; do
            sleep 10
          done
